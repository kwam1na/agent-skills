name: Release

# Pushing a set's tag publishes that set: a GitHub release named by the tag, carrying the set's checked-in product
# archives and their release files, so adopters download the exact bytes the qualification records bind.
on:
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the corpus
        run: python -m pip install -e .
      - name: Publish the tagged set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Checkout can leave a lightweight copy of the tag; fetch the pushed object itself.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # A release tag is annotated and names a commit already merged to main.
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; a release is never replaced."
            exit 0
          fi
          shopt -s nullglob
          metadata=(qualifications/product/*-"$TAG".release.json)
          if [ ${#metadata[@]} -eq 0 ]; then
            echo "$TAG has no product archives under qualifications/product/" >&2
            exit 1
          fi
          assets=()
          for file in "${metadata[@]}"; do
            archive="${file%.release.json}.zip"
            python scripts/build-release.py verify --archive "$archive" --metadata "$file"
            assets+=("$archive" "$file")
          done
          python - "$TAG" "${metadata[@]}" > notes.md <<'EOF'
          import json, pathlib, subprocess, sys

          tag, metadata = sys.argv[1], sys.argv[2:]
          notes = pathlib.Path(f"docs/releases/{tag}.md")
          if notes.exists():
              body = notes.read_text(encoding="utf-8").split("\n", 1)[1].strip() + "\n"
          else:
              subject = subprocess.run(["git", "log", "-1", "--format=%s", tag], capture_output=True, text=True,
                                       check=True).stdout.strip()
              body = f"The `{tag}` release set: {subject}\n"
          body += "\n## Archives\n\n| Profile | Release id | Archive sha256 |\n| --- | --- | --- |\n"
          for path in metadata:
              release = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              body += f"| {release['profile']} | `{release['releaseId']}` | `{release['archiveSha256']}` |\n"
          body += ("\nEach archive's `.release.json` records the same sha256. Check the downloaded zip against it"
                   " (`shasum -a 256`) before installing, then install it as the README at this tag describes.\n")
          print(body, end="")
          EOF
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest "${assets[@]}"
