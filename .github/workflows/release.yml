name: Release

# Pushing a version tag publishes a release built from the tagged tree, with its records and build provenance. Publishing
# requires CI's success on the exact tagged commit, read from CI's run for that commit rather than running the matrix again.
on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  guard:
    runs-on: ubuntu-latest
    # Outlasts the channel's bounded wait for CI, so that wait is what ends it.
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.existing.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Checkout can leave a lightweight copy of the tag; fetch the pushed object itself.
          git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG"
          # This run builds the commit it started on, so a moved tag publishes nothing.
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          python scripts/release_channel.py order --tag "$TAG"
          # A release tag is annotated and names a commit already merged to main.
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main
      - name: Stop if the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release is never replaced, and an unclear answer stops here rather than reading as absent.
        run: python scripts/release_channel.py existing --tag "$TAG" >> "$GITHUB_OUTPUT"
      - name: Require CI's success on the tagged commit
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/release_channel.py ci --tag "$TAG" --repo "$REPOSITORY" --commit "$(git rev-parse "refs/tags/$TAG^{commit}")"

  publish:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the release command's dependencies
        run: python -m pip install -e ".[test]"
      - name: Build, verify and qualify the release
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/cut-release.py --version "$TAG" --out "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Publish every output file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          # The guard's check may be two and a half hours old by now, or from an earlier attempt of this run.
          python scripts/release_channel.py order --tag "$TAG"
          gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/published.txt"
          previous="$(python scripts/release_channel.py previous --tag "$TAG" --published "$RUNNER_TEMP/published.txt")"
          generate=(-f "tag_name=$TAG")
          if [ -n "$previous" ]; then generate+=(-f "previous_tag_name=$previous"); fi
          gh api -X POST "repos/$REPOSITORY/releases/generate-notes" "${generate[@]}" --jq .body > "$RUNNER_TEMP/generated.md"
          python scripts/release_channel.py notes --tag "$TAG" --out "$OUT" --generated "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/notes.md"
          flags="$(python scripts/release_channel.py flags --tag "$TAG")"
          # A release that appeared since the guard makes this fail, and nothing replaces it.
          # shellcheck disable=SC2086
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $flags "$OUT"/*
