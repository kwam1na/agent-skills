name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate corpus and record inventory
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate-registry.py | tee validation-result.json
      - run: python tests/test_registry.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python-version }}
          path: validation-result.json
