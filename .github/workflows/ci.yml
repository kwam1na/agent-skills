name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push stops a change request's earlier run. Each run on main is its own group: a group keeps only
  # one pending run even without cancelling, which would drop a merge's run, and publishing reads those.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bytecode under skills/ fails corpus validation, which cut-release runs first.
# CI runs no tests: the full local suite before a tag is the only run of them.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Every change proves the release path, the way a version tag's publish job runs it.
  cut-release:
    name: cut-release (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: development
            node-file: .nvmrc
          - runtime: minimum
            node: "22.6.0"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.node-file }}
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the release command's dependencies
        run: python -m pip install -e ".[test]"
      - name: Build, verify and qualify a release
        run: python scripts/cut-release.py --version v0.0.0-rc.0 --out "$RUNNER_TEMP/release"
      - name: Check its outputs and that the tree is unchanged
        run: |
          test "$(ls "$RUNNER_TEMP/release" | wc -l)" -eq 14
          test -z "$(git status --porcelain)"
