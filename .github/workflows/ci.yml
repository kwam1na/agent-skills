name: CI

on:
  pull_request:
    # Retargeting a pull request is an edit; its base decides the marker gate.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The run-delivery tool is POSIX-only. Its video evidence cases need ffmpeg and ffprobe, and its harness
      # configuration case needs the runtime's minimum Node, so they run here rather than skip.
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: "22.6.0"
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate corpus and record inventory
        shell: bash
        # A change bound for the default branch may not carry pending qualification.
        env:
          TARGET_BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -o pipefail
          python scripts/validate-registry.py --target-base "$TARGET_BASE" | tee validation-result.json
      - run: python tests/test_registry.py
      # The parallel runner the merge checks use: discover's verdict, across worker processes.
      - run: python scripts/run-tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python-version }}
          path: validation-result.json
